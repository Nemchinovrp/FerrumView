<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FerrumView — просмотр камеры</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151e; color: #e6edf7; }
    body { margin: 0; }
    main { max-width: 1100px; margin: auto; padding: 32px 20px; }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; letter-spacing: -.6px; }
    header p, .hint { color: #9cabc1; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05080d; border-radius: 14px; margin: 20px 0; }
    form { display: flex; flex-wrap: wrap; gap: 12px; }
    label { width: 100%; font-weight: 600; }
    input { flex: 1; min-width: 180px; background: #192230; color: inherit; border: 1px solid #40516c; border-radius: 8px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; background: #a6e5cb; color: #10261e; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #c4f4e1; }
    :focus-visible { outline: 3px solid #a6e5cb; outline-offset: 3px; }
    #status { padding: 12px 0; margin: 0; color: #a6e5cb; }
    #status[data-error="true"] { color: #ffacac; }
    .hint { font-size: 14px; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; margin-top: 20px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    #cameras { display: grid; gap: 8px; }
    .camera { text-align: left; background: #192230; color: #e6edf7; border: 1px solid #40516c; overflow-wrap: anywhere; }
    .camera[aria-pressed="true"] { background: #a6e5cb; color: #10261e; border-color: #a6e5cb; }
    .camera:hover { background: #304338; }
    .camera[aria-pressed="true"]:hover { background: #c4f4e1; }
    #camera-title { margin-top: 0; }
    video { margin-top: 0; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } #cameras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<main>
  <header><h1>FerrumView</h1><p>Просмотр камеры</p></header>
  <div class="layout">
  <aside aria-label="Список камер">
    <h2>Камеры <span id="camera-count"></span></h2>
    <p id="list-status" class="hint" role="status">Загрузка списка…</p>
    <div id="cameras"></div>
  </aside>
  <section aria-labelledby="camera-title">
  <h2 id="camera-title">Просмотр камеры</h2>
  <video id="video" controls autoplay muted playsinline aria-label="Видеопоток камеры"></video>
  <p id="status" role="status" aria-live="polite">Укажите ссылку на камеру.</p>
  <form id="form">
    <label for="url">Ссылка на HLS-поток</label>
    <input id="url" type="url" required placeholder="https://example.com/index.m3u8" autocomplete="off" spellcheck="false">
    <button type="submit">Подключить</button>
    <button id="reconnect" type="button">Переподключить</button>
  </form>
  <p class="hint">Видео запускается без звука. Звук и полный экран доступны в плеере.</p>
  </section>
  </div>
</main>
<script>
  const video = document.getElementById('video');
  const input = document.getElementById('url');
  const status = document.getElementById('status');
  const cameraList = document.getElementById('cameras');
  const listStatus = document.getElementById('list-status');
  let cameras = [];
  let hls;
  let revision = 0;
  let failed = false;
  function message(text, error = false) {
    status.textContent = text;
    status.dataset.error = String(error);
  }
  function play() {
    const current = revision;
    video.play().catch(() => {
      if (current === revision && !failed) message('Нажмите ▶ в плеере, чтобы начать просмотр.');
    });
  }
  function connect() {
    let url;
    try {
      url = new URL(input.value.trim());
      if (!['https:', 'http:'].includes(url.protocol)) throw new Error();
      url.hash = '';
    } catch {
      message('Введите корректную HTTP или HTTPS ссылку на поток.', true);
      return;
    }
    const selected = cameras.find(camera => camera.url === input.value.trim());
    document.getElementById('camera-title').textContent = selected ? selected.name : 'Другая камера';
    for (const [index, button] of Array.from(cameraList.children).entries()) {
      button.setAttribute('aria-pressed', String(cameras[index] === selected));
    }
    revision++;
    failed = false;
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
    message('Подключение к камере…');
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url.href;
      play();
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.MANIFEST_PARSED, play);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        failed = true;
        message('Не удалось воспроизвести поток. Проверьте ссылку, срок действия токена и доступность камеры, затем переподключитесь.', true);
        hls.destroy();
        hls = null;
      });
      hls.loadSource(url.href);
      hls.attachMedia(video);
    } else {
      failed = true;
      message('Плеер недоступен: проверьте доступ к интернету и используйте браузер с поддержкой HLS.', true);
    }
  }
  video.addEventListener('playing', () => { failed = false; message('● Прямой эфир'); });
  video.addEventListener('waiting', () => { if (!failed) message('Буферизация…'); });
  video.addEventListener('pause', () => { if (!failed) message('Пауза'); });
  video.addEventListener('error', () => {
    failed = true;
    message('Ошибка воспроизведения. Проверьте доступность потока и нажмите «Переподключить».', true);
  });
  document.getElementById('form').addEventListener('submit', event => { event.preventDefault(); connect(); });
  document.getElementById('reconnect').addEventListener('click', connect);
  const initialRevision = revision;
  fetch('/api/config', { cache: 'no-store' })
    .then(async response => { if (!response.ok) throw new Error(await response.text()); return response.json(); })
    .then(config => {
      cameras = config.cameras;
      document.getElementById('camera-count').textContent = `(${cameras.length})`;
      listStatus.textContent = cameras.length ? '' : 'Добавьте камеры в streams.txt: Название | URL';
      for (const camera of cameras) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'camera';
        button.textContent = camera.name;
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => { input.value = camera.url; connect(); });
        cameraList.append(button);
      }
      const initialUrl = config.stream_url || cameras[0]?.url;
      if (initialUrl && !input.value && revision === initialRevision) {
        input.value = initialUrl;
        connect();
      }
    })
    .catch(error => { listStatus.textContent = `Не удалось загрузить список камер: ${error.message}. Исправьте файл и обновите страницу.`; });
</script>
</body>
</html>
