<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FerrumView — камеры</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151e; color: #e6edf7; }
    body { margin: 0; }
    main { max-width: 1800px; margin: auto; padding: 24px; }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; }
    .hint, header p { color: #9cabc1; }
    #cameras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: 20px 0; }
    .camera { min-width: 0; background: #192230; border: 1px solid #34445b; border-radius: 12px; overflow: hidden; }
    h2 { font-size: 17px; padding: 14px 16px; margin: 0; overflow-wrap: anywhere; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05080d; object-fit: contain; }
    .footer { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
    .status { flex: 1; min-width: 100px; margin: 0; color: #a6e5cb; font-size: 14px; }
    .status[data-error="true"] { color: #ffacac; }
    form { display: flex; flex-wrap: wrap; gap: 12px; }
    label { width: 100%; }
    input { flex: 1; min-width: 180px; background: #192230; color: inherit; border: 1px solid #40516c; border-radius: 8px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; background: #a6e5cb; color: #10261e; font: inherit; cursor: pointer; }
    button:hover { background: #c4f4e1; }
    :focus-visible { outline: 3px solid #a6e5cb; outline-offset: 3px; }
    @media (max-width: 1000px) { #cameras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { #cameras { grid-template-columns: minmax(0, 1fr); } main { padding: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<main>
  <header><h1>FerrumView</h1><p>Камеры <span id="camera-count"></span></p></header>
  <p id="list-status" class="hint" role="status">Загрузка камер…</p>
  <div id="cameras" aria-label="Камеры видеонаблюдения"></div>
  <form id="form">
    <label for="url">Добавить поток для просмотра</label>
    <input id="url" type="url" required placeholder="https://example.com/index.m3u8" autocomplete="off" spellcheck="false">
    <button type="submit">Добавить камеру</button>
  </form>
  <p class="hint">Камеры запускаются без звука. Звук и полный экран доступны в каждом плеере.</p>
</main>
<script>
  const grid = document.getElementById('cameras');
  const listStatus = document.getElementById('list-status');
  const input = document.getElementById('url');
  const players = [];

  function addCamera(camera) {
    const card = document.createElement('section');
    card.className = 'camera';
    const title = document.createElement('h2');
    title.textContent = camera.name;
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('aria-label', camera.name);
    const footer = document.createElement('div');
    footer.className = 'footer';
    const status = document.createElement('p');
    status.className = 'status';
    status.setAttribute('role', 'status');
    const reconnect = document.createElement('button');
    reconnect.type = 'button';
    reconnect.textContent = 'Переподключить';
    reconnect.setAttribute('aria-label', `Переподключить: ${camera.name}`);
    footer.append(status, reconnect);
    card.append(title, video, footer);
    grid.append(card);
    document.getElementById('camera-count').textContent = `(${grid.children.length})`;

    let hls = null;
    let revision = 0;
    let failed = false;
    function message(text, error = false) {
      status.textContent = text;
      status.dataset.error = String(error);
    }
    function stop() {
      revision++;
      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src');
      video.load();
    }
    function connect() {
      stop();
      failed = false;
      let url;
      try {
        url = new URL(camera.url);
        if (!['https:', 'http:'].includes(url.protocol)) throw new Error();
        url.hash = '';
      } catch {
        failed = true;
        message('Некорректная HTTP(S) ссылка.', true);
        return;
      }
      message('Подключение…');
      const current = revision;
      function play() {
        video.play().catch(() => {
          if (current === revision && !failed) message('Нажмите ▶ для просмотра.');
        });
      }
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url.href;
        play();
      } else if (window.Hls && Hls.isSupported()) {
        const instance = new Hls();
        hls = instance;
        instance.on(Hls.Events.MANIFEST_PARSED, play);
        instance.on(Hls.Events.ERROR, (_, data) => {
          if (current !== revision || !data.fatal) return;
          failed = true;
          message('Поток недоступен. Проверьте ссылку и переподключитесь.', true);
          instance.destroy();
          hls = null;
        });
        instance.loadSource(url.href);
        instance.attachMedia(video);
      } else {
        failed = true;
        message('HLS-плеер недоступен. Проверьте браузер и интернет.', true);
      }
    }
    video.addEventListener('playing', () => { failed = false; message('● Прямой эфир'); });
    video.addEventListener('waiting', () => { if (!failed) message('Буферизация…'); });
    video.addEventListener('pause', () => { if (!failed) message('Пауза'); });
    video.addEventListener('error', () => {
      failed = true;
      message('Ошибка видео. Попробуйте переподключиться.', true);
    });
    reconnect.addEventListener('click', connect);
    players.push({ stop, connect });
    connect();
  }

  document.getElementById('form').addEventListener('submit', event => {
    event.preventDefault();
    try {
      const url = new URL(input.value.trim());
      if (!['https:', 'http:'].includes(url.protocol)) throw new Error();
    } catch {
      input.setCustomValidity('Введите HTTP или HTTPS ссылку.');
      input.reportValidity();
      return;
    }
    addCamera({ name: 'Дополнительная камера', url: input.value.trim() });
    input.value = '';
  });
  input.addEventListener('input', () => input.setCustomValidity(''));
  fetch('/api/config', { cache: 'no-store' })
    .then(async response => { if (!response.ok) throw new Error(await response.text()); return response.json(); })
    .then(config => {
      const cameras = [...config.cameras];
      if (config.stream_url && !cameras.some(camera => camera.url === config.stream_url)) {
        cameras.unshift({ name: 'Камера из аргумента запуска', url: config.stream_url });
      }
      cameras.forEach(addCamera);
      listStatus.textContent = cameras.length ? '' : 'Добавьте камеры в streams.txt: Название | URL';
    })
    .catch(error => { listStatus.textContent = `Не удалось загрузить камеры: ${error.message}. Исправьте файл и обновите страницу.`; });
  window.addEventListener('pagehide', () => players.forEach(player => player.stop()));
  window.addEventListener('pageshow', event => { if (event.persisted) players.forEach(player => player.connect()); });
</script>
</body>
</html>
