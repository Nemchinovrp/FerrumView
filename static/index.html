<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FerrumView — камеры</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10151e; color: #e6edf7; }
    body { margin: 0; }
    main { max-width: 1800px; margin: auto; padding: 24px; }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; }
    .hint, header p { color: #9cabc1; }
    #cameras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: 20px 0; }
    .camera { min-width: 0; background: #192230; border: 1px solid #34445b; border-radius: 12px; overflow: hidden; }
    .camera:fullscreen { display: flex; flex-direction: column; background: #05080d; }
    .camera:fullscreen video { flex: 1; min-height: 0; }
    h2 { font-size: 17px; padding: 14px 16px; margin: 0; overflow-wrap: anywhere; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05080d; object-fit: contain; }
    .footer { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
    .status { flex: 1; min-width: 100px; margin: 0; color: #a6e5cb; font-size: 14px; }
    .status[data-error="true"] { color: #ffacac; }
    form { display: flex; flex-wrap: wrap; gap: 12px; }
    label { width: 100%; }
    input { flex: 1; min-width: 180px; background: #192230; color: inherit; border: 1px solid #40516c; border-radius: 8px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; background: #a6e5cb; color: #10261e; font: inherit; cursor: pointer; }
    button:hover { background: #c4f4e1; }
    :focus-visible { outline: 3px solid #a6e5cb; outline-offset: 3px; }
    @media (max-width: 1000px) { #cameras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { #cameras { grid-template-columns: minmax(0, 1fr); } main { padding: 16px; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<main>
  <header><h1>FerrumView</h1><p>Камеры <span id="camera-count"></span></p></header>
  <p id="list-status" class="hint" role="status">Загрузка камер…</p>
  <div id="cameras" aria-label="Камеры видеонаблюдения"></div>
  <form id="form">
    <label for="url">Добавить поток для просмотра</label>
    <input id="url" type="url" required placeholder="https://example.com/index.m3u8" autocomplete="off" spellcheck="false">
    <button type="submit">Добавить камеру</button>
  </form>
  <p class="hint">Только прямой эфир, без перемотки. Камеры запускаются без звука. Возможна небольшая задержка трансляции.</p>
</main>
<script>
  const grid = document.getElementById('cameras');
  const listStatus = document.getElementById('list-status');
  const input = document.getElementById('url');
  const players = [];

  function addCamera(camera) {
    const card = document.createElement('section');
    card.className = 'camera';
    const title = document.createElement('h2');
    title.textContent = camera.name;
    const video = document.createElement('video');
    video.controls = false;
    // Playback is started explicitly after buffering (or immediately for native HLS).
    video.autoplay = false;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('aria-label', camera.name);
    const footer = document.createElement('div');
    footer.className = 'footer';
    const status = document.createElement('p');
    status.className = 'status';
    status.setAttribute('role', 'status');
    const reconnect = document.createElement('button');
    reconnect.type = 'button';
    reconnect.textContent = 'Переподключить';
    reconnect.setAttribute('aria-label', `Переподключить: ${camera.name}`);
    const sound = document.createElement('button');
    sound.type = 'button';
    sound.textContent = 'Включить звук';
    sound.setAttribute('aria-pressed', 'false');
    sound.setAttribute('aria-label', `Звук: ${camera.name}`);
    sound.addEventListener('click', () => {
      video.muted = !video.muted;
      sound.textContent = video.muted ? 'Включить звук' : 'Выключить звук';
      sound.setAttribute('aria-pressed', String(!video.muted));
    });
    const fullscreen = document.createElement('button');
    fullscreen.type = 'button';
    fullscreen.textContent = 'Полный экран';
    fullscreen.setAttribute('aria-label', `Полный экран: ${camera.name}`);
    fullscreen.hidden = !card.requestFullscreen;
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement === card) await document.exitFullscreen();
        else await card.requestFullscreen();
      } catch { message('Полный экран недоступен в этом браузере.'); }
    });
    card.addEventListener('fullscreenchange', () => {
      fullscreen.textContent = document.fullscreenElement === card ? 'Свернуть' : 'Полный экран';
    });
    const start = document.createElement('button');
    start.type = 'button';
    start.textContent = 'Смотреть онлайн';
    start.hidden = true;
    start.addEventListener('click', () => {
      syncToLive(true);
      video.play().then(() => { start.hidden = true; }).catch(() => message('Не удалось запустить видео. Нажмите «Переподключить».', true));
    });
    footer.append(status, start, sound, fullscreen, reconnect);
    card.append(title, video, footer);
    grid.append(card);
    document.getElementById('camera-count').textContent = `(${grid.children.length})`;

    let hls = null;
    let revision = 0;
    let failed = false;
    let retryTimer = null;
    let watchdog = null;
    let attempts = 0;
    let active = false;
    let starting = false;
    let lastProgress = 0;
    let lastTime = 0;
    let healthySince = null;
    function syncToLive(force = false) {
      if (!active || !video.seekable.length) return;
      const edge = video.seekable.end(video.seekable.length - 1);
      const beginning = video.seekable.start(video.seekable.length - 1);
      const target = hls?.liveSyncPosition ?? Math.max(beginning, edge - 10);
      // Never jump into data that has not arrived yet.
      const buffered = Array.from({ length: video.buffered.length }, (_, i) => i)
        .some(i => target >= video.buffered.start(i) && target + 1 < video.buffered.end(i));
      if (Number.isFinite(target) && target >= beginning && target <= edge &&
          buffered && (force || target - video.currentTime > 30)) video.currentTime = target;
    }
    function clearTimers() {
      clearTimeout(retryTimer);
      clearInterval(watchdog);
      retryTimer = null;
      watchdog = null;
    }
    function scheduleRetry(reason) {
      if (!active || retryTimer !== null) return;
      stop();
      failed = true;
      const delay = Math.min(3000 * 2 ** Math.min(attempts++, 4), 30000);
      message(`${reason} Повтор через ${delay / 1000} с.`, true);
      if (camera.url.startsWith('/relay/')) {
        const stoppedRevision = revision;
        fetch(camera.url.replace(/index\.m3u8$/, 'status'), { cache: 'no-store' })
          .then(response => response.ok ? response.json() : null)
          .then(data => { if (data && revision === stoppedRevision && failed) message(data.message, true); })
          .catch(() => {});
      }
      retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
    }
    function message(text, error = false) {
      status.textContent = text;
      status.dataset.error = String(error);
    }
    function stop() {
      active = false;
      clearTimers();
      revision++;
      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src');
      video.load();
    }
    function connect() {
      stop();
      failed = false;
      start.hidden = true;
      let url;
      try {
        url = new URL(camera.url, window.location.href);
        if (!['https:', 'http:'].includes(url.protocol)) throw new Error();
        url.hash = '';
      } catch {
        failed = true;
        message('Некорректная HTTP(S) ссылка.', true);
        return;
      }
      active = true;
      starting = true;
      healthySince = null;
      lastProgress = performance.now();
      lastTime = video.currentTime;
      watchdog = setInterval(() => {
        if (!active) return;
        const now = performance.now();
        // hls.js manages its own live position and recovery. Only native HLS needs this fallback.
        if (!hls && !video.paused) syncToLive();
        if (!starting && video.paused && !video.ended) {
          lastProgress = now;
          healthySince = null;
          return;
        }
        if (video.currentTime !== lastTime && !video.paused) {
          lastTime = video.currentTime;
          lastProgress = now;
          healthySince ??= now;
          if (now - healthySince >= 30000) attempts = 0;
        } else {
          healthySince = null;
          if (now - lastProgress >= (starting ? 45000 : 30000)) scheduleRetry('Видео не поступает.');
        }
      }, 1000);
      message('Подключение…');
      const current = revision;
      function play() {
        video.play().catch(error => {
          if (current !== revision || failed) return;
          if (error.name === 'NotAllowedError') {
            starting = false;
            start.hidden = false;
            message('Нажмите «Смотреть онлайн».');
          } else if (error.name !== 'AbortError') {
            scheduleRetry('Не удалось запустить видео.');
          }
        });
      }
      if (window.Hls && Hls.isSupported()) {
        const instance = new Hls({
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 8,
          maxLiveSyncPlaybackRate: 1,
          backBufferLength: 15,
          lowLatencyMode: false,
        });
        hls = instance;
        // Build a contiguous reserve before starting, rather than playing the first fragment dry.
        let playbackRequested = false;
        instance.on(Hls.Events.BUFFER_APPENDED, () => {
          if (current !== revision || playbackRequested) return;
          for (let i = 0; i < video.buffered.length; i++) {
            const startTime = Math.max(video.currentTime, video.buffered.start(i));
            if (video.buffered.end(i) - startTime >= 6) {
              playbackRequested = true;
              play();
              return;
            }
          }
          message('Накопление буфера…');
        });
        // A short finite clip may end before reaching the live startup reserve.
        instance.on(Hls.Events.BUFFER_EOS, () => {
          if (current !== revision || playbackRequested || !video.buffered.length) return;
          playbackRequested = true;
          play();
        });
        instance.on(Hls.Events.ERROR, (_, data) => {
          if (current !== revision || !data.fatal) return;
          console.error('Camera playback failed', camera.name, data.details, data.response?.code);
          scheduleRetry(`Ошибка потока (${data.details}).`);
        });
        instance.loadSource(url.href);
        instance.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url.href;
        play();
      } else {
        stop();
        failed = true;
        message('HLS-плеер недоступен. Проверьте браузер и интернет.', true);
      }
    }
    video.addEventListener('playing', () => {
      if (!active) return;
      starting = false;
      failed = false;
      start.hidden = true;
      lastProgress = performance.now();
      message('● Прямой эфир');
    });
    video.addEventListener('play', () => {
      if (active) { lastProgress = performance.now(); starting = true; }
    });
    video.addEventListener('waiting', () => { if (active && !failed) message('Буферизация…'); });
    video.addEventListener('pause', () => {
      if (active && !failed && !video.error && video.readyState >= 2) {
        starting = false;
        start.hidden = false;
        message('Воспроизведение остановлено. Нажмите «Смотреть онлайн».');
      }
    });
    video.addEventListener('error', () => { if (video.error) scheduleRetry('Ошибка видео.'); });
    video.addEventListener('ended', () => scheduleRetry('Поток завершился.'));
    reconnect.addEventListener('click', () => { attempts = 0; connect(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && active) syncToLive();
    });
    players.push({ stop, connect });
    connect();
  }

  document.getElementById('form').addEventListener('submit', event => {
    event.preventDefault();
    try {
      const url = new URL(input.value.trim());
      if (!['https:', 'http:'].includes(url.protocol)) throw new Error();
    } catch {
      input.setCustomValidity('Введите HTTP или HTTPS ссылку.');
      input.reportValidity();
      return;
    }
    addCamera({ name: 'Дополнительная камера', url: input.value.trim() });
    input.value = '';
  });
  input.addEventListener('input', () => input.setCustomValidity(''));
  fetch('/api/config', { cache: 'no-store' })
    .then(async response => { if (!response.ok) throw new Error(await response.text()); return response.json(); })
    .then(config => {
      const cameras = [...config.cameras];
      if (config.stream_url && !cameras.some(camera => camera.url === config.stream_url)) {
        cameras.unshift({ name: 'Камера из аргумента запуска', url: config.stream_url });
      }
      cameras.forEach(addCamera);
      listStatus.textContent = cameras.length ? '' : 'Добавьте камеры в streams.txt: Название | URL';
    })
    .catch(error => { listStatus.textContent = `Не удалось загрузить камеры: ${error.message}. Исправьте файл и обновите страницу.`; });
  window.addEventListener('pagehide', () => players.forEach(player => player.stop()));
  window.addEventListener('pageshow', event => { if (event.persisted) players.forEach(player => player.connect()); });
</script>
</body>
</html>
